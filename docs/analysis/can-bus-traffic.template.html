<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PikPak CAN Bus</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f4; --panel: #ffffff; --ink: #1c2429; --muted: #5c6870; --line: #cfd5cc;
    --enclosure: #7c8a82; --canh: #c98a00; --canl: #2c7a5b; --eth: #2e5eaa; --estop: #c43c2e; --motor: #e9ede7;
    --font: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a1d; --panel: #1d2429; --ink: #e6ebe8; --muted: #a3aeb3; --line: #333d44;
            --enclosure: #8a9891; --canh: #e8b04a; --canl: #5fc2a0; --eth: #7fa6e8; --estop: #e5675a; --motor: #2a333a; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 14px 20px 30px; }
  h1 { font-size: 20px; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 10px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  svg { display: block; width: 100%; height: auto; max-height: 260px; }
  figcaption { color: var(--muted); font-size: 13px; padding: 10px 4px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--c); margin-right: 8px; vertical-align: middle; }
  /* SVG classes */
  .box { fill: var(--panel); stroke: var(--ink); stroke-width: 1.6; }
  .enclosure { fill: none; stroke: var(--enclosure); stroke-width: 1.4; stroke-dasharray: 7 5; }
  .label { font-family: var(--font); fill: var(--ink); font-size: 14px; }
  .label.small { font-size: 12px; fill: var(--muted); }
  .label.title { font-size: 15px; font-weight: 600; }
  .label.encl { font-size: 13px; font-weight: 600; fill: var(--enclosure); letter-spacing: .06em; }
  .canh { stroke: var(--canh); stroke-width: 3; fill: none; }
  .canl { stroke: var(--canl); stroke-width: 3; fill: none; }
  .eth { stroke: var(--eth); stroke-width: 3; fill: none; }
  .stub { stroke: var(--ink); stroke-width: 1.6; }
  .motor { fill: var(--motor); stroke: var(--ink); stroke-width: 1.6; }
  .estop-ring { fill: #f2d24b; stroke: var(--ink); stroke-width: 1.4; }
  .estop-btn { fill: var(--estop); stroke: #7a1f16; stroke-width: 1.4; }
  .route { fill: none; stroke: none; }  /* invisible paths the messages will travel along */
  /* Current CAN frame panel */
  :root { --t-iface: #8a959b; --t-id: #2e5eaa; --t-dlc: #c98a00; --t-cmd: #6e4db8; --t-obj: #2c8c7c; --t-val: #2e8b3a; --t-raw: #9aa3a0; }
  @media (prefers-color-scheme: dark) { :root { --t-id: #7fa6e8; --t-dlc: #e8b04a; --t-cmd: #a78bea; --t-obj: #5fc2b0; --t-val: #6fcf7a; --t-raw: #6f7b82; } }
  .frame { margin-top: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .frame .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
  .frame h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .frame select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; margin-left: auto; }
  .summary { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
  .summary .dim { color: var(--muted); font-weight: 400; }
  .raw { font-family: Consolas, "Courier New", monospace; font-size: 20px; letter-spacing: .02em; white-space: pre; overflow-x: auto; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
  .raw .tok { border-bottom: 3px solid var(--c); padding-bottom: 3px; cursor: help; position: relative; }
  .raw .tok:hover, .raw .tok:focus { background: color-mix(in srgb, var(--c) 18%, transparent); outline: none; }
  .tip { position: fixed; z-index: 10; max-width: 340px; background: var(--ink); color: var(--bg); font-family: var(--font); font-size: 13px; line-height: 1.4; padding: 8px 10px; border-radius: 5px; pointer-events: none; white-space: normal; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .tip b { color: inherit; }
  .tip[hidden] { display: none; }
  .nav { display: grid; grid-template-columns: 190px 1fr 190px; gap: 12px; align-items: center; margin-top: 14px; }
  @media (max-width: 760px) { .nav { grid-template-columns: 1fr; } }
  .nav .side { display: flex; flex-direction: column; gap: 6px; }
  .nav button { font: inherit; font-size: 13px; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); cursor: pointer; line-height: 1.3; }
  .nav button:hover { border-color: var(--eth); }
  .nav button:disabled { opacity: .45; cursor: default; }
  .nav button b { display: block; font-weight: 600; }
  .nav button small { color: var(--muted); }
  .nav .side.right button { text-align: right; }
  .when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .frame .head .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  /* hover detail on diagram parts */
  svg [data-tip] { cursor: help; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PikPak CAN bus</h1>
  <p class="sub">PikPak 007. Hover anything for detail.</p>

  <figure>
    <svg viewBox="0 0 1400 250" role="img" aria-label="Left to right: the RCU containing the AGX computer and, over an Ethernet link, the Rozum board; the E-Stop sits outside the RCU below the AGX; a CAN high and CAN low pair into the robot, and inside the robot five Rozum drive boards in series, nodes 1, 2, 3, 5 and 6, each with a motor beneath it.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--eth)"/>
        </marker>
      </defs>
      <!-- Routes for animated messages (invisible). ids are stable: use them later. -->
      <path id="route-eth" class="route" d="M240,80 L340,80"/>
      <path id="route-bus" class="route" d="M500,80 L1275,80"/>
      <rect class="enclosure" x="30" y="14" width="500" height="118" rx="8"/>
      <text class="label encl" x="46" y="36">RCU</text>
      <g id="agx" data-tip="The RCU's computer. It runs the actuator controller, which decides every CAN message and reads every reply. Its logs go to Elastic; its telemetry goes to Grafana.">
        <rect class="box" x="60" y="50" width="180" height="60" rx="6"/>
        <text class="label title" x="150" y="76" text-anchor="middle">AGX computer</text>
        <text class="label small" x="150" y="96" text-anchor="middle">runs the actuator controller</text>
      </g>
      <line class="stub" x1="150" y1="110" x2="150" y2="152"/>
      <g id="estop" data-tip="The emergency stop. Wired to the AGX; pressing it stops the robot through the controller, not over the CAN bus.">
        <circle class="estop-ring" cx="150" cy="178" r="26"/>
        <circle class="estop-btn" cx="150" cy="178" r="17"/>
        <text class="label title" x="150" y="226" text-anchor="middle">E-Stop</text>
      </g>
      <line class="eth" x1="240" y1="80" x2="340" y2="80" marker-end="url(#arrow)"/>
      <text class="label small" x="290" y="66" text-anchor="middle">Ethernet</text>
      <text class="label small" x="290" y="102" text-anchor="middle" data-tip="The AGX sends each CAN frame to the Rozum board over Ethernet and receives every frame the board hears on the bus.">CAN messages</text>
      <g id="rozum-board" data-tip="The CAN master. Takes the AGX's messages over Ethernet and puts them on the bus; sends its own heartbeat (700) every 250 ms and clock tick (27F) every 50 ms. Node 0 by its heartbeat; 127 if the tick is read as a standard PDO.">
        <rect class="box" x="340" y="50" width="160" height="60" rx="6"/>
        <text class="label title" x="420" y="76" text-anchor="middle">Rozum board</text>
        <text class="label small" x="420" y="96" text-anchor="middle">CAN master, node 0 / 127?</text>
      </g>
      <line class="canh" x1="500" y1="73" x2="620" y2="73"/>
      <line class="canl" x1="500" y1="87" x2="620" y2="87"/>
      <text class="label small" x="560" y="62" text-anchor="middle">CAN high</text>
      <text class="label small" x="560" y="106" text-anchor="middle">CAN low</text>
      <text class="label small" x="560" y="124" text-anchor="middle" data-tip="Twisted pair, 1 Mbit/s. Every frame from any device is seen by every other device; the COB-ID says who it is for. Carries about 3,600 frames a second while the robot works, roughly half the bus capacity.">1 Mbit/s</text>
      <rect class="enclosure" x="580" y="14" width="790" height="226" rx="8"/>
      <text class="label encl" x="596" y="36">ROBOT</text>
      <line class="canh" x1="730" y1="73" x2="770" y2="73"/>
      <line class="canl" x1="730" y1="87" x2="770" y2="87"/>
      <line class="canh" x1="880" y1="73" x2="920" y2="73"/>
      <line class="canl" x1="880" y1="87" x2="920" y2="87"/>
      <line class="canh" x1="1030" y1="73" x2="1070" y2="73"/>
      <line class="canl" x1="1030" y1="87" x2="1070" y2="87"/>
      <line class="canh" x1="1180" y1="73" x2="1220" y2="73"/>
      <line class="canl" x1="1180" y1="87" x2="1220" y2="87"/>
      <g id="drive-1" data-tip="Rozum servo drive, CANopen node 1. Answers SDO reads on 581, takes requests on 601, heartbeats on 701, emergencies on 081. Holds a 256-point trajectory buffer.">
        <rect class="box" x="620" y="50" width="110" height="60" rx="6"/>
        <text class="label title" x="675" y="74" text-anchor="middle">Rozum drive</text>
        <text class="label small" x="675" y="95" text-anchor="middle">node 1</text>
      </g>
      <g id="drive-2" data-tip="Rozum servo drive, CANopen node 2. Replies on 582, requests on 602, heartbeat 702, emergency 082.">
        <rect class="box" x="770" y="50" width="110" height="60" rx="6"/>
        <text class="label title" x="825" y="74" text-anchor="middle">Rozum drive</text>
        <text class="label small" x="825" y="95" text-anchor="middle">node 2</text>
      </g>
      <g id="drive-3" data-tip="Rozum servo drive, CANopen node 3. Replies on 583, requests on 603, heartbeat 703, emergency 083.">
        <rect class="box" x="920" y="50" width="110" height="60" rx="6"/>
        <text class="label title" x="975" y="74" text-anchor="middle">Rozum drive</text>
        <text class="label small" x="975" y="95" text-anchor="middle">node 3</text>
      </g>
      <g id="drive-5" data-tip="Rozum servo drive, CANopen node 5. Replies on 585, requests on 605, heartbeat 705, emergency 085. Node 4 is not fitted.">
        <rect class="box" x="1070" y="50" width="110" height="60" rx="6"/>
        <text class="label title" x="1125" y="74" text-anchor="middle">Rozum drive</text>
        <text class="label small" x="1125" y="95" text-anchor="middle">node 5</text>
      </g>
      <g id="drive-6" data-tip="Rozum servo drive, CANopen node 6. Replies on 586, requests on 606, heartbeat 706, emergency 086.">
        <rect class="box" x="1220" y="50" width="110" height="60" rx="6"/>
        <text class="label title" x="1275" y="74" text-anchor="middle">Rozum drive</text>
        <text class="label small" x="1275" y="95" text-anchor="middle">node 6</text>
      </g>
      <line class="stub" x1="675" y1="110" x2="675" y2="154"/>
      <g id="motor-1" data-tip="Motor 1. Its position, velocity, current and temperature come back in the 16-byte status block the master reads from drive 1 about 56 times a second."><circle class="motor" cx="675" cy="178" r="24"/><text class="label title" x="675" y="184" text-anchor="middle">M1</text><text class="label small" x="675" y="222" text-anchor="middle">Motor 1</text></g>
      <line class="stub" x1="825" y1="110" x2="825" y2="154"/>
      <g id="motor-2" data-tip="Motor 2. Its position, velocity, current and temperature come back in the 16-byte status block the master reads from drive 2 about 56 times a second."><circle class="motor" cx="825" cy="178" r="24"/><text class="label title" x="825" y="184" text-anchor="middle">M2</text><text class="label small" x="825" y="222" text-anchor="middle">Motor 2</text></g>
      <line class="stub" x1="975" y1="110" x2="975" y2="154"/>
      <g id="motor-3" data-tip="Motor 3. Its position, velocity, current and temperature come back in the 16-byte status block the master reads from drive 3 about 56 times a second."><circle class="motor" cx="975" cy="178" r="24"/><text class="label title" x="975" y="184" text-anchor="middle">M3</text><text class="label small" x="975" y="222" text-anchor="middle">Motor 3</text></g>
      <line class="stub" x1="1125" y1="110" x2="1125" y2="154"/>
      <g id="motor-5" data-tip="Motor 5. Its position, velocity, current and temperature come back in the 16-byte status block the master reads from drive 5 about 56 times a second."><circle class="motor" cx="1125" cy="178" r="24"/><text class="label title" x="1125" y="184" text-anchor="middle">M5</text><text class="label small" x="1125" y="222" text-anchor="middle">Motor 5</text></g>
      <line class="stub" x1="1275" y1="110" x2="1275" y2="154"/>
      <g id="motor-6" data-tip="Motor 6. Its position, velocity, current and temperature come back in the 16-byte status block the master reads from drive 6 about 56 times a second."><circle class="motor" cx="1275" cy="178" r="24"/><text class="label title" x="1275" y="184" text-anchor="middle">M6</text><text class="label small" x="1275" y="222" text-anchor="middle">Motor 6</text></g>
      <!-- Messages will be drawn here -->
      <g id="messages"></g>
    </svg>

  </figure>

  <div class="legend">
    <span style="--c: var(--eth)">Ethernet</span>
    <span style="--c: var(--canh)">CAN high</span>
    <span style="--c: var(--canl)">CAN low</span>
  </div>

  <div class="nav">
    <div class="side left">
      <button id="prev-frame"><b>◀ Previous frame</b><small id="prev-frame-dt"></small></button>
      <button id="prev-type"><b id="prev-type-label">◀ Go to previous</b><small id="prev-type-dt"></small></button>
    </div>
    <section class="frame" id="frame">
      <div class="head">
        <h2>Current CAN frame</h2>
        <span class="when" id="f-when"></span>
        <span class="hint">← → step one frame · Shift ← → step to the same type</span>
      </div>
      <p class="summary" id="f-summary"></p>
      <div class="raw" id="f-raw"></div>
    </section>
    <div class="side right">
      <button id="next-frame"><b>Next frame ▶</b><small id="next-frame-dt"></small></button>
      <button id="next-type"><b id="next-type-label">Go to next ▶</b><small id="next-type-dt"></small></button>
    </div>
  </div>
  <div class="tip" id="tip" hidden></div>
</div>

<script>
(function () {
  const IDS = RAW.ids, T = RAW.T, I = RAW.I, D = RAW.D, N = T.length, T0 = T[0];
  const startClock = RAW.start_clock;             // "HH:MM:SS.ffffff" of the first frame
  const NODE = n => n === 0 ? "Rozum board" : "drive " + n;
  const C = { iface: "var(--t-iface)", id: "var(--t-id)", dlc: "var(--t-dlc)", cmd: "var(--t-cmd)", obj: "var(--t-obj)", val: "var(--t-val)", raw: "var(--t-raw)" };
  const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const hex2 = b => b.toString(16).toUpperCase().padStart(2, "0");
  const f32 = bs => { const dv = new DataView(new ArrayBuffer(4)); bs.forEach((b, i) => dv.setUint8(i, b)); return dv.getFloat32(0, true); };
  const u32 = bs => (bs[0] | bs[1] << 8 | bs[2] << 16 | (bs[3] << 24 >>> 0)) >>> 0;
  const fmt = (x, d) => Number(x).toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
  const clock = us => { const [h, m, sec] = startClock.split(":"); const base = (+h) * 3600e6 + (+m) * 60e6 + parseFloat(sec) * 1e6 + us;
    const hh = Math.floor(base / 3600e6), mm = Math.floor(base % 3600e6 / 60e6), ss = (base % 60e6) / 1e6;
    return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + ":" + ss.toFixed(3).padStart(6, "0"); };

  // ---- decode every frame once, in order, keeping per-node SDO context
  const STATUS = ["position", "velocity", "current", "temperature"];
  const PVT = ["position", "velocity", "time"];
  const up = {}, down = {};       // node -> {obj, sub, size, buf}
  const objName = (obj, sub) => obj === "2014" && sub === 1 ? "the 16-byte status block" : obj === "2202" ? (sub === 1 ? "buffer clear" : sub === 2 ? "buffer fill level" : sub === 3 ? "buffer free slots" : "buffer object") : obj === "2200" ? "the trajectory buffer" : "object " + obj + ":" + hex2(sub);
  const familyOf = (obj, sub) => obj === "2014" ? "Motor status" : obj === "2202" ? (sub === 1 ? "Buffer clear" : "Buffer poll") : obj === "2200" ? "PVT point" : "Configuration write";
  const runsOver = (names, unit, offset, n, buf, isFloat) => {   // split n bytes at block offset into field runs
    const segs = []; let o = offset;
    while (o < offset + n) {
      const f = Math.floor(o / 4), start = f * 4, end = Math.min(start + 4, offset + n), take = end - o;
      const name = names[f] || "byte " + o;
      let what;
      if (o === start && take === 4) what = name + " = <b>" + (isFloat(f) ? fmt(f32(buf.slice(start, start + 4)), 3) : u32(buf.slice(start, start + 4))) + "</b>" + (unit(f) ? " " + unit(f) : "");
      else if (end === start + 4 && buf.length >= start + 4) what = name + ", last " + take + " of 4 bytes: with the earlier ones = <b>" + (isFloat(f) ? fmt(f32(buf.slice(start, start + 4)), 3) : u32(buf.slice(start, start + 4))) + "</b>" + (unit(f) ? " " + unit(f) : "");
      else what = name + ", first " + take + " of 4 bytes; the rest comes in the next segment";
      segs.push([take, what, "val"]); o = end;
    }
    return segs;
  };
  const statusUnit = f => ["", "", "A", "°C"][f];
  function decode(i) {
    const id = IDS[I[i]], v = parseInt(id, 16), b = [];
    for (let k = 0; k < D[i].length; k += 2) b.push(parseInt(D[i].substr(k, 2), 16));
    const r = { family: "Other", sub: "", from: "?", to: "?", kind: "COB-ID " + id, segs: [] };
    if (id === "1FFFFFFF") { Object.assign(r, { family: "Error frame", from: "any node", to: "every node", kind: "Error frame: no COB-ID." }); r.segs = [[1, "The monitor's error class <b>" + hex2(b[0]) + "</b>. Not a data frame: a node signalling a corrupted frame.", "val"]]; return r; }
    if (v === 0x700 || (v >= 0x701 && v <= 0x77F)) { const n = v - 0x700; const st = { 0: "boot-up", 4: "stopped", 5: "operational", 0x7F: "pre-operational", 2: "state 02 (not a standard state)" }[b[0]] || "state " + hex2(b[0]);
      Object.assign(r, { family: n ? "Heartbeat (drive)" : "Heartbeat (master)", from: NODE(n), to: n ? "Rozum board" : "all drives", kind: "COB-ID <b>" + id + "</b> = 700 + node " + n + ": heartbeat." }); r.segs = [[1, "NMT state <b>" + hex2(b[0]) + "</b> = " + st + ".", "val"]]; return r; }
    if (v === 0x27F) { Object.assign(r, { family: "Master tick", from: "Rozum board", to: "all drives", kind: "COB-ID <b>27F</b>: the master's clock tick, a broadcast." }); r.segs = [[4, "Microsecond counter = <b>" + fmt(u32(b) / 1e6, 3) + " s</b> (little-endian, wraps every 600 s).", "val"]]; return r; }
    if (v === 0x000) { const cmd = { 1: "start", 2: "stop", 0x80: "enter pre-operational", 0x81: "reset node", 0x82: "reset communication" }[b[0]] || "command " + hex2(b[0]);
      Object.assign(r, { family: "NMT command", sub: cmd, from: "Rozum board", to: b[1] ? "drive " + b[1] : "all drives", kind: "COB-ID <b>000</b>: network management command." }); r.segs = [[1, "Command <b>" + hex2(b[0]) + "</b> = " + cmd + ".", "cmd"], [1, "Target node <b>" + hex2(b[1]) + "</b>" + (b[1] ? "" : " = every node") + ".", "obj"]]; return r; }
    if (v === 0x080 || v === 0x100) { Object.assign(r, { family: "SYNC", from: "Rozum board", to: "all drives", kind: "COB-ID <b>" + id + "</b>: SYNC." }); r.segs = b.length ? [[b.length, "SYNC payload.", "raw"]] : []; return r; }
    if (v >= 0x081 && v <= 0x0FF) { const n = v - 0x80, code = b[1] << 8 | b[0]; const name = { 0: "error reset / no error", 0x3120: "input voltage too low", 0x8130: "heartbeat lost", 0xFF80: "manufacturer-specific FF80", 0xFF00: "manufacturer-specific FF00" }[code] || "code " + code.toString(16).toUpperCase();
      Object.assign(r, { family: "Emergency", sub: name, from: NODE(n), to: "Rozum board", kind: "COB-ID <b>" + id + "</b> = 080 + node " + n + ": emergency." });
      r.segs = [[2, "Error code <b>" + code.toString(16).toUpperCase().padStart(4, "0") + "</b> (bytes swapped): " + name + ".", "val"], [1, "Error register <b>" + hex2(b[2]) + "</b>" + (b[2] & 0x10 ? ": communication error" : b[2] ? "" : ": no error") + ".", "val"], [1, "Manufacturer byte.", "raw"], [4, "Manufacturer value: as a float <b>" + fmt(f32(b.slice(4, 8)), 3) + "</b>.", "val"]]; return r; }

    r.from = isReq ? "Rozum board" : NODE(n); r.to = isReq ? NODE(n) : "Rozum board";
    const obj = () => hex2(b[2]) + hex2(b[1]), sub = () => b[3];
    const objSegs = () => [[2, "Object <b>" + obj() + "</b> (low byte first).", "obj"], [1, "Sub-index <b>" + hex2(sub()) + "</b>: " + objName(obj(), sub()) + ".", "obj"]];

        if (!consistent) { ctx = null; delete down[n]; } else ctx.buf.push(...b.slice(1, 1 + k));
        Object.assign(r, { family: ctx ? familyOf(ctx.obj, ctx.sub) : "PVT point", sub: ctx ? "data segment " + (Math.floor(off / 7) + 1) + " of " + Math.ceil(ctx.size / 7) : (last ? "last segment" : "segment") + " (earlier frames not kept by the monitor)" });
        r.segs = [[1, "Command byte <b>" + hex2(cs) + "</b>: data segment, toggle bit " + t + ", " + k + " bytes valid" + (last ? ", the last segment" : ", more to follow") + ".", "cmd"]];
        r.segs.push(...(ctx && ctx.obj === "2200" ? runsOver(PVT, f => (f === 2 ? "ms" : ""), off, k, ctx.buf, f => f < 2) : [[k, k + " data bytes of a trajectory point whose first frame the monitor did not keep.", "val"]]));
        if (k < 7) r.segs.push([7 - k, "Padding.", "raw"]); if (last) delete down[n]; return r; }
      if ((cs & 0xE0) === 0x60) { const t = (cs >> 4) & 1, ctx = up[n]; Object.assign(r, { family: ctx ? familyOf(ctx.obj, ctx.sub) : "SDO read", sub: "next segment" }); r.segs = [[1, "Command byte <b>" + hex2(cs) + "</b>: send the next segment (toggle bit " + t + ").", "cmd"], [7, "Unused.", "raw"]]; return r; }

    if (cs === 0x60) { const ctx = down[n]; Object.assign(r, { family: ctx ? familyOf(ctx.obj, ctx.sub) : "SDO write", sub: "accepted" }); r.segs = [[1, "Command byte <b>60</b>: write accepted.", "cmd"], ...(b.length > 1 ? objSegs() : []), [4, "Unused.", "raw"]]; return r; }
    if ((cs & 0xE0) === 0x20) { const t = (cs >> 4) & 1, ctx = down[n]; Object.assign(r, { family: ctx ? familyOf(ctx.obj, ctx.sub) : "SDO write", sub: "segment acknowledged" }); r.segs = [[1, "Command byte <b>" + hex2(cs) + "</b>: segment accepted (toggle bit " + t + ").", "cmd"], [7, "Unused.", "raw"]]; return r; }
    if ((cs & 0xE0) === 0x00) { const k = 7 - ((cs >> 1) & 7), last = cs & 1, t = (cs >> 4) & 1; let ctx = up[n]; const off = ctx ? ctx.buf.length : 0;

      r.segs = [[1, "Command byte <b>" + hex2(cs) + "</b>: data segment, toggle bit " + t + ", " + k + " bytes valid" + (last ? ", the last segment" : ", more to follow") + ".", "cmd"]];
      r.segs.push(...(ctx && ctx.obj === "2014" ? runsOver(STATUS, statusUnit, off, k, ctx.buf, () => true) : [[k, k + " data bytes of a status block whose earlier segments the monitor did not keep, so the fields cannot be named.", "val"]]));

  }
  const DEC = new Array(N);
  for (let i = 0; i < N; i++) DEC[i] = decode(i);

  // ---- rendering
  const byId = id => document.getElementById(id);
  const tok = (text, cls, tip) => '<span class="tok" tabindex="0" style="--c:' + C[cls] + '" data-tip="' + esc(tip).replace(/"/g, "&quot;") + '">' + esc(text) + '</span>';
  const dtText = (from, to) => { const us = T[to] - T[from]; const a = Math.abs(us); const s = a < 1000 ? a + " µs" : a < 1e6 ? fmt(a / 1000, a < 10000 ? 2 : 1) + " ms" : fmt(a / 1e6, 2) + " s"; return (us < 0 ? "−" : "+") + s; };

    const d = DEC[cur], id = IDS[I[cur]], bytes = D[cur].match(/../g) || [], dlc = bytes.length;
    byId("f-when").textContent = fmt((T[cur] - T0) / 1000, 3) + " ms from start · " + clock(T[cur] - T0) + " · frame " + fmt(cur + 1, 0) + " of " + fmt(N, 0);
