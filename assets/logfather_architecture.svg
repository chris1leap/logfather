<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d92a8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="880" fill="#12181f"/>

  <!-- ======== band backgrounds ======== -->
  <rect x="30" y="30" width="1120" height="290" rx="10" fill="#181f28" stroke="#2c3946"/>
  <text x="50" y="58" fill="#8fa3b8" font-size="13" font-weight="bold" letter-spacing="2">WHAT YOU SEE</text>

  <rect x="30" y="490" width="1120" height="210" rx="10" fill="#181f28" stroke="#2c3946"/>
  <text x="50" y="518" fill="#8fa3b8" font-size="13" font-weight="bold" letter-spacing="2">DATA PLUMBING</text>

  <rect x="30" y="730" width="1120" height="120" rx="10" fill="#181f28" stroke="#2c3946"/>
  <text x="50" y="756" fill="#8fa3b8" font-size="13" font-weight="bold" letter-spacing="2">OUTSIDE WORLD</text>

  <!-- ======== arrows (under boxes where possible) ======== -->
  <g stroke="#5c6f82" stroke-width="1.5" fill="none">
    <!-- UI to hub -->
    <path d="M 157 144 L 460 372" marker-end="url(#arrow)"/>
    <path d="M 397 144 L 512 372" marker-end="url(#arrow)"/>
    <path d="M 665 144 L 612 372" marker-end="url(#arrow)"/>
    <path d="M 965 144 L 702 372" marker-end="url(#arrow)"/>
    <path d="M 300 264 Q 380 330 452 378" marker-end="url(#arrow)"/>
    <path d="M 700 264 L 648 372" marker-end="url(#arrow)"/>
    <path d="M 900 264 Q 800 330 730 372" marker-end="url(#arrow)"/>
    <!-- calibration dialog straight down to belt model -->
    <path d="M 985 264 L 985 528" marker-end="url(#arrow)"/>
    <!-- hub to data -->
    <path d="M 520 442 L 220 528" marker-end="url(#arrow)"/>
    <path d="M 575 442 L 460 528" marker-end="url(#arrow)"/>
    <path d="M 680 442 L 870 528" marker-end="url(#arrow)"/>
    <!-- UI direct to data (skirting the hub) -->
    <path d="M 330 144 L 277 230 L 210 528" marker-end="url(#arrow)"/>
    <path d="M 600 144 L 585 230 L 255 528" marker-end="url(#arrow)"/>
    <path d="M 770 144 L 812 230 L 722 528" marker-end="url(#arrow)"/>
    <path d="M 157 264 L 157 528" marker-end="url(#arrow)"/>
    <path d="M 350 264 L 285 528" marker-end="url(#arrow)"/>
    <!-- data internal -->
    <path d="M 332 560 L 305 560" marker-end="url(#arrow)"/>
    <!-- data to outside -->
    <path d="M 175 594 L 175 762" marker-end="url(#arrow)"/>
    <path d="M 260 594 L 690 762" marker-end="url(#arrow)"/>
    <path d="M 560 682 L 945 762" marker-end="url(#arrow)"/>
    <path d="M 985 594 L 1005 762" marker-end="url(#arrow)"/>
    <!-- share to cache -->
    <path d="M 572 795 L 597 795" marker-end="url(#arrow)"/>
  </g>
  <g fill="#8fa3b8" font-size="11">
    <text x="255" y="255">day picked</text>
    <text x="425" y="290">click-through</text>
    <text x="675" y="300">open clip / playhead</text>
    <text x="300" y="480">Elastic queries</text>
    <text x="742" y="480">OCR clock sync</text>
    <text x="140" y="690">HTTPS</text>
    <text x="455" y="740">clips copied on open</text>
  </g>

  <!-- ======== UI boxes ======== -->
  <g>
    <rect x="50" y="80" width="215" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="157" y="106" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">Date_Picker_frontend.py</text>
    <text x="157" y="126" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Pick a system and a day</text>

    <rect x="290" y="80" width="215" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="397" y="106" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">Time_Picker.py</text>
    <text x="397" y="126" fill="#9fb0c0" font-size="11.5" text-anchor="middle">24-hour timeline of clips + events</text>

    <rect x="530" y="80" width="270" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="665" y="106" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">Log_vid_gui.py</text>
    <text x="665" y="126" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Video + logs viewer, frame-aligned</text>

    <rect x="825" y="80" width="280" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="965" y="106" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">target_buffer_widget.py</text>
    <text x="965" y="126" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Live pick-queue panel</text>

    <rect x="50" y="200" width="215" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="157" y="226" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">overview_widget.py</text>
    <text x="157" y="246" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Live fleet board (today)</text>

    <rect x="290" y="200" width="280" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="430" y="226" fill="#e8eef4" font-size="12.5" font-weight="bold" text-anchor="middle">fleetwide_elastic_search_widget.py</text>
    <text x="430" y="246" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Fleet-wide search dashboard</text>

    <rect x="600" y="200" width="200" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="700" y="226" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">settings_dialog.py</text>
    <text x="700" y="246" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Settings tabs (in viewer)</text>

    <rect x="825" y="200" width="280" height="64" rx="8" fill="#20303f" stroke="#5b9bd5"/>
    <text x="965" y="226" fill="#e8eef4" font-size="12.5" font-weight="bold" text-anchor="middle">conveyor_calibration_dialog.py</text>
    <text x="965" y="246" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Two-click belt calibration wizard</text>
  </g>

  <!-- ======== hub ======== -->
  <rect x="440" y="372" width="300" height="70" rx="10" fill="#3a2a10" stroke="#e8a33d" stroke-width="2"/>
  <text x="590" y="402" fill="#f4e3c2" font-size="15" font-weight="bold" text-anchor="middle">Main_Window.py</text>
  <text x="590" y="424" fill="#c8b48e" font-size="12" text-anchor="middle">The hub — wires every panel together</text>

  <!-- ======== data boxes ======== -->
  <g>
    <rect x="50" y="530" width="250" height="64" rx="8" fill="#1c3327" stroke="#4caf7d"/>
    <text x="175" y="556" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">elastic_loader.py</text>
    <text x="175" y="576" fill="#9fb0c0" font-size="11.5" text-anchor="middle">All Elastic queries + day cache</text>

    <rect x="330" y="530" width="240" height="64" rx="8" fill="#1c3327" stroke="#4caf7d"/>
    <text x="450" y="556" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">target_buffer_loader.py</text>
    <text x="450" y="576" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Rebuilds the pick queue from logs</text>

    <rect x="600" y="530" width="230" height="64" rx="8" fill="#1c3327" stroke="#4caf7d"/>
    <text x="715" y="556" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">time_ocr.py</text>
    <text x="715" y="576" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Reads the on-screen CCTV clock</text>

    <rect x="860" y="530" width="250" height="64" rx="8" fill="#1c3327" stroke="#4caf7d"/>
    <text x="985" y="556" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">conveyor_calibration.py</text>
    <text x="985" y="576" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Belt speed model per robot</text>

    <rect x="330" y="618" width="240" height="64" rx="8" fill="#1c3327" stroke="#4caf7d"/>
    <text x="450" y="644" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">settings_store.py</text>
    <text x="450" y="664" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Read by every module</text>

    <rect x="600" y="618" width="230" height="64" rx="8" fill="#1c3327" stroke="#4caf7d"/>
    <text x="715" y="644" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">app_version.py</text>
    <text x="715" y="664" fill="#9fb0c0" font-size="11.5" text-anchor="middle">Which build is running</text>
  </g>

  <!-- ======== outside world ======== -->
  <g stroke-dasharray="5 4">
    <rect x="50" y="765" width="250" height="60" rx="8" fill="#1c232b" stroke="#8a93a0"/>
    <rect x="330" y="765" width="242" height="60" rx="8" fill="#1c232b" stroke="#8a93a0"/>
    <rect x="600" y="765" width="250" height="60" rx="8" fill="#1c232b" stroke="#8a93a0"/>
    <rect x="880" y="765" width="250" height="60" rx="8" fill="#1c232b" stroke="#8a93a0"/>
  </g>
  <g>
    <text x="175" y="790" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">Elastic Cloud</text>
    <text x="175" y="810" fill="#9fb0c0" font-size="11.5" text-anchor="middle">logstash-*, pikpak-* indices</text>
    <text x="451" y="790" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">CCTV share (Z:/public)</text>
    <text x="451" y="810" fill="#9fb0c0" font-size="11.5" text-anchor="middle">PikPakNNN/YYYY/MM/DD/*.mp4</text>
    <text x="725" y="790" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">Local cache</text>
    <text x="725" y="810" fill="#9fb0c0" font-size="11.5" text-anchor="middle">clips, OCR offsets, annotations</text>
    <text x="1005" y="790" fill="#e8eef4" font-size="13" font-weight="bold" text-anchor="middle">Home-dir JSON</text>
    <text x="1005" y="810" fill="#9fb0c0" font-size="11.5" text-anchor="middle">settings + belt calibrations</text>
  </g>
</svg>
